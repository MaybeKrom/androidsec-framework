<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}androsec{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}" type="image/png">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=byte">
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip" href="#content">Skip to content</a>
  <header class="top">
    <a class="brand" href="{{ url_for('home') }}">
      <img class="logo" src="{{ url_for('static', filename='androsec-logo.png') }}" alt="androsec">
    </a>
    <nav aria-label="Primary">
      <a href="{{ url_for('home') }}" {% if request.endpoint == 'home' %}class="active"{% endif %}>Home</a>
      <a href="{{ url_for('assess') }}" {% if request.endpoint != 'home' and not (request.endpoint or '').startswith('device.') %}class="active"{% endif %}>Assessment</a>
      <a href="{{ url_for('device.page') }}" {% if (request.endpoint or '').startswith('device.') %}class="active"{% endif %}>Device</a>
    </nav>
  </header>
  <main id="content">
    {% block body %}{% endblock %}
  </main>
  <footer class="foot">
    <p>Authorized testing only. Reports stay on this machine.</p>
  </footer>
</body>
</html>
