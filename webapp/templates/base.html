<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}androidsec{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="top">
    <a class="brand" href="{{ url_for('home') }}">
      <span class="mark" aria-hidden="true">as</span>
      <span>androidsec</span>
    </a>
    <nav>
      <a href="{{ url_for('home') }}" {% if request.endpoint == 'home' %}class="active"{% endif %}>Home</a>
      <a href="{{ url_for('assess') }}" {% if request.endpoint != 'home' and not (request.endpoint or '').startswith('device.') %}class="active"{% endif %}>Assessment</a>
      <a href="{{ url_for('device.page') }}" {% if (request.endpoint or '').startswith('device.') %}class="active"{% endif %}>Device</a>
    </nav>
  </header>
  <main>
    {% block body %}{% endblock %}
  </main>
  <footer class="foot">Authorized testing only. Reports stay on this machine.</footer>
</body>
</html>
